# Persistent private pilot. Billing remains controlled in the Render dashboard.
services:
  - type: web
    name: cotton-roots-private-trial
    runtime: docker
    plan: starter
    branch: staging/phone-trial
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: cotton-roots-pilot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CRC_DEPLOYMENT
        value: render
      - key: CRC_DATA_DIR
        value: /var/data
      - key: CRC_ACCOUNT_LOGIN_ONLY
        value: "1"
      - key: CRC_CUSTOMER_PASSWORD
        generateValue: true
      - key: CRC_CONTRACTOR_PASSWORD
        generateValue: true
      - key: CRC_OWNER_PASSWORD
        generateValue: true
